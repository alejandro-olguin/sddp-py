[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sddp"
version = "0.1.0"
description = "A Python port of SDDP.jl: Stochastic Dual Dynamic Programming for multistage stochastic programs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pyoptinterface>=0.6",
    "highsbox>=1.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "matplotlib>=3.7"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["tier1: Tier 1 parity", "tier2: Tier 2 parity", "tier3: Tier 3 parity", "slow: takes more than about a minute"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N803", "N806", "N802", "E741", "B905"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/sddp"]
